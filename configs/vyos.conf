# =====================================================================
# VyOS (rolling 2026) - pare-feu central stateful
# Retranscription de l'Annexe A du rapport du jalon 4 (configuration
# reconstituee a partir des captures, pas exportee de la VM).
#
# Mapping des interfaces :
#   eth1 -> R-Cloud      192.168.200.1/30
#   eth2 -> Switch WAN   10.0.1.254/24 (R-Paris .1, R-Lyon .2, R-Marseille .3)
#   eth3 -> R-Ext-Radio  192.168.10.1/30
#   eth4 -> R-DMZ        192.168.100.1/30
#   eth5 -> R-Ext-Etabli 192.168.20.1/30
# (eth0 et les interfaces "fantomes" VirtualBox ne sont pas utilisees)
# =====================================================================

configure

# ---------------------------------------------------------------------
# A.1 Interfaces
# ---------------------------------------------------------------------
set interfaces ethernet eth2 address '10.0.1.254/24'
set interfaces ethernet eth2 description 'WAN-Sites'
set interfaces ethernet eth1 address '192.168.200.1/30'
set interfaces ethernet eth1 description 'Vers-R-Cloud'
set interfaces ethernet eth5 address '192.168.20.1/30'
set interfaces ethernet eth5 description 'Vers-R-Ext-Etabli'
set interfaces ethernet eth3 address '192.168.10.1/30'
set interfaces ethernet eth3 description 'Vers-R-Ext-Radio'
set interfaces ethernet eth4 address '192.168.100.1/30'
set interfaces ethernet eth4 description 'Vers-R-DMZ'
commit

# ---------------------------------------------------------------------
# A.2 OSPF (area 0 avec les 3 routeurs de site)
# ---------------------------------------------------------------------
set protocols ospf parameters router-id '4.4.4.4'
set protocols ospf area 0 network '10.0.1.0/24'
set protocols ospf area 0 network '192.168.200.0/30'
set protocols ospf area 0 network '192.168.20.0/30'
set protocols ospf area 0 network '192.168.10.0/30'
set protocols ospf area 0 network '192.168.100.0/30'
commit

# ---------------------------------------------------------------------
# A.3 Routes statiques
# (les routeurs de zone R-DMZ / R-Cloud / R-Ext-* utilisent des routes
#  statiques, pas OSPF)
# ---------------------------------------------------------------------
set protocols static route 172.16.0.0/16 next-hop '10.0.1.1'
set protocols static route 172.17.0.0/16 next-hop '10.0.1.2'
set protocols static route 172.18.0.0/16 next-hop '10.0.1.3'
set protocols static route 192.168.201.0/24 next-hop '192.168.200.2'
set protocols static route 192.168.21.0/24 next-hop '192.168.20.2'
set protocols static route 192.168.11.0/24 next-hop '192.168.10.2'
set protocols static route 192.168.101.0/24 next-hop '192.168.100.2'
commit

# ---------------------------------------------------------------------
# A.4 Firewall stateful
# ---------------------------------------------------------------------
# Trafic retour des connexions etablies accepte globalement
set firewall global-options state-policy established action accept
set firewall global-options state-policy related action accept

# DMZ-IN : trafic entrant depuis la zone DMZ (eth4)
set firewall ipv4 name DMZ-IN default-action drop
set firewall ipv4 name DMZ-IN rule 5 action accept
set firewall ipv4 name DMZ-IN rule 5 source address '192.168.100.1'
set firewall ipv4 name DMZ-IN rule 10 action accept
set firewall ipv4 name DMZ-IN rule 10 protocol tcp
set firewall ipv4 name DMZ-IN rule 10 destination port 443
set firewall ipv4 name DMZ-IN rule 20 action accept
set firewall ipv4 name DMZ-IN rule 20 protocol tcp
set firewall ipv4 name DMZ-IN rule 20 destination port 104
set firewall ipv4 name DMZ-IN rule 30 action accept
set firewall ipv4 name DMZ-IN rule 30 protocol icmp
set firewall ipv4 name DMZ-IN rule 35 action accept
set firewall ipv4 name DMZ-IN rule 35 source address '10.0.1.0/24'
set firewall ipv4 name DMZ-IN rule 36 action accept
set firewall ipv4 name DMZ-IN rule 36 source address '172.16.0.0/16'
set firewall ipv4 name DMZ-IN rule 37 action accept
set firewall ipv4 name DMZ-IN rule 37 source address '172.17.0.0/16'
set firewall ipv4 name DMZ-IN rule 38 action accept
set firewall ipv4 name DMZ-IN rule 38 source address '172.18.0.0/16'

# RADIO-IN : trafic entrant depuis la zone Radiologues (eth3)
set firewall ipv4 name RADIO-IN default-action drop
set firewall ipv4 name RADIO-IN rule 10 action accept
set firewall ipv4 name RADIO-IN rule 10 source address '192.168.11.0/24'
set firewall ipv4 name RADIO-IN rule 10 destination address '192.168.101.0/24'
set firewall ipv4 name RADIO-IN rule 20 action accept
set firewall ipv4 name RADIO-IN rule 20 source address '192.168.11.0/24'
set firewall ipv4 name RADIO-IN rule 20 destination address '192.168.201.0/24'
# NB : la regle 30 accepte l'ICMP sans restriction de destination. Avec
# cette seule configuration, un ping Radio -> 172.x passerait ; le blocage
# ICMP 3/13 observe au test T05 provient donc d'une regle non retranscrite
# dans l'annexe (voir "Limites connues" du README).
set firewall ipv4 name RADIO-IN rule 30 action accept
set firewall ipv4 name RADIO-IN rule 30 protocol icmp

# ETABLI-IN : trafic entrant depuis la zone Etablissements (eth5)
set firewall ipv4 name ETABLI-IN default-action drop
set firewall ipv4 name ETABLI-IN rule 10 action accept
set firewall ipv4 name ETABLI-IN rule 10 source address '192.168.21.0/24'
set firewall ipv4 name ETABLI-IN rule 10 destination address '192.168.101.0/24'
set firewall ipv4 name ETABLI-IN rule 20 action accept
set firewall ipv4 name ETABLI-IN rule 20 protocol icmp

# Application des rulesets via le forward filter (selon l'interface d'entree)
set firewall ipv4 forward filter rule 10 action jump
set firewall ipv4 forward filter rule 10 inbound-interface name eth4
set firewall ipv4 forward filter rule 10 jump-target DMZ-IN
set firewall ipv4 forward filter rule 20 action jump
set firewall ipv4 forward filter rule 20 inbound-interface name eth3
set firewall ipv4 forward filter rule 20 jump-target RADIO-IN
set firewall ipv4 forward filter rule 30 action jump
set firewall ipv4 forward filter rule 30 inbound-interface name eth5
set firewall ipv4 forward filter rule 30 jump-target ETABLI-IN

# CORRECTION par rapport a l'Annexe A : l'annexe contenait une regle 40
#   rule 40 inbound-interface name eth4 / jump-target DMZ-OUT
# Elle faisait doublon avec la regle 10 (meme interface eth4) : DMZ-IN se
# terminant par un drop, la regle 40 n'etait jamais atteinte. Le ruleset
# DMZ-OUT n'etait pas non plus defini dans l'annexe (il apparait vide, en
# default accept, dans "show firewall"). La regle 40 est donc supprimee.
# Pour filtrer le trafic SORTANT vers la DMZ, il faudrait plutot une regle
# basee sur "outbound-interface name eth4".

commit
save
